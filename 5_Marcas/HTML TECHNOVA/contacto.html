<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de contacto</title> <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav>
        <div class="logo">TECHNOVA</div>
        <ul class="enlaces">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="equipo.html">Equipo</a></li>
            <li><a href="infraestructura.html">Infraestructura</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="documentacion.html">Documentación</a></li>
        </ul>
    </nav>

    <main class="form-container">
        <div class="contact-layout">
            <div class="contact-info">
                <span class="tagline-rojo">CONECTANDO LA TRANSFORMACIÓN</span>
                <h2>Contáctanos</h2> <p class="sub-text">¿Preparado para el siguiente nivel de infraestructura técnica?</p>
            </div>

            <div class="contact-form-wrapper">
                <form action="#"> <div class="form-grid">
                        
                        <div class="field">
                            <label for="nombre">NOMBRE *</label> <input type="text" id="nombre" name="nombre" 
                                   minlength="3" maxlength="20" required 
                                   title="El nombre debe tener entre 3 y 20 caracteres"> </div>

                        <div class="field">
                            <label for="email">EMAIL *</label>
                            <input type="email" id="email" name="email" 
                                   pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$" required 
                                   title="Formato: nombre@dominio.com"> </div>

                        <div class="field full">
                            <label for="interes">INTERÉS *</label>
                            <select id="interes" name="interes" required>
                                <option value="" disabled selected>Seleccionar -</option>
                                <option value="1">Infraestructura IT</option>
                                <option value="2">Ciberseguridad</option>
                                <option value="3">Sistemas Cloud</option>
                                <option value="4">Otros</option>
                            </select>
                        </div>

                        <div class="field full">
                            <label for="mensaje">MENSAJE *</label>
                            <textarea id="mensaje" name="mensaje" rows="4" 
                                      minlength="10" maxlength="200" required></textarea> </div>

                        <div class="field full checkbox-field">
                            <input type="checkbox" id="privacidad" name="privacidad" required>
                            <label for="privacidad" class="inline-label">Acepto la política de privacidad *</label>
                        </div>
                    </div>

                    <div class="buttons">
                        <button type="submit">ENVIAR SOLICITUD</button> <button type="reset" class="btn-cancel">CANCELAR</button> </div>
                </form>
            </div>
        </div>
    </main>

    <footer>© 2026 TechNova Solutions S.L.</footer>
</body>
</html>
